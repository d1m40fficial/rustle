<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вкладки</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="sidebar-head">
    <div class="sidebar-heading">
      <span class="sidebar-kicker">Вкладки</span>
      <span class="sidebar-count" id="count">0</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-new-top" id="new-tab" type="button" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка"><span class="sidebar-plus">+</span></button>
      <button class="sidebar-collapse" id="collapse" type="button" title="Свернуть панель" aria-label="Свернуть панель">‹</button>
    </div>
  </header>
  <div class="sidebar-pinned" id="pinned" role="tablist" aria-label="Закреплённые вкладки"></div>
  <div class="sidebar-tabs" id="tabs" role="tablist" aria-label="Вкладки"></div>
  <script src="sidebar.js"></script>
</body>
</html>
