<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вкладки</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="sidebar-head">
    <div class="sidebar-heading">
      <span class="sidebar-kicker">Вкладки</span>
      <span class="sidebar-count" id="count">0</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-new-top" id="new-tab" type="button" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка"><span class="sidebar-plus">+</span></button>
      <button class="sidebar-collapse" id="collapse" type="button" title="Свернуть панель" aria-label="Свернуть панель">‹</button>
    </div>
  </header>
  <div class="sidebar-pinned" id="pinned" role="tablist" aria-label="Закреплённые вкладки"></div>
  <div class="sidebar-tabs" id="tabs" role="tablist" aria-label="Вкладки"></div>
  <div class="resize-overlay" aria-hidden="true">
    <div class="resize-edge" data-edge="10" style="top:0;left:0;bottom:0;width:10px;cursor:ew-resize"></div>
    <div class="resize-edge" data-edge="12" style="top:0;left:0;right:0;height:10px;cursor:ns-resize"></div>
    <div class="resize-edge" data-edge="15" style="left:0;right:0;bottom:0;height:10px;cursor:ns-resize"></div>
    <div class="resize-edge" data-edge="13" style="top:0;left:0;width:20px;height:20px;cursor:nwse-resize"></div>
    <div class="resize-edge" data-edge="16" style="left:0;bottom:0;width:20px;height:20px;cursor:nesw-resize"></div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
