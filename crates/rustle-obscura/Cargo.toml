[package]
name = "rustle-obscura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustle-engine = { path = "../rustle-engine" }
serde_json.workspace = true
ureq = { version = "2.12", features = ["tls"] }
tungstenite = { version = "0.24", features = ["handshake", "url"] }
base64 = "0.22"


[[bin]]
name = "obscura-cdp-probe"
path = "src/bin/probe.rs"
