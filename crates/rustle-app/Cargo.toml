[package]
name = "rustle-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
rfd = "0.15"
rustle-core.workspace = true
rustle-storage.workspace = true
rustle-ui.workspace = true
serde_json.workspace = true
ureq = { version = "2.12", features = ["tls"] }
tao.workspace = true
url.workspace = true
wry.workspace = true

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_System_Com"] }
webview2-com.workspace = true
windows-core.workspace = true