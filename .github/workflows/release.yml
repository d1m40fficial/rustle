name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install WebView2 Runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:TEMP "MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer -UseBasicParsing
          Start-Process $installer -ArgumentList "/silent","/install" -Wait

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "C:\Program Files (x86)" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version -or $version -eq "main") { $version = "0.1.0" }
          ./scripts/build-release.ps1 -Version $version

      - name: Smoke test portable
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "Rustle-*-portable.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dist/smoke
          $exe = Get-ChildItem dist/smoke -Filter rustle.exe -Recurse | Select-Object -First 1
          $process = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) { throw "Rustle exited during smoke test" }
          Stop-Process -Id $process.Id -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          gh release create $tag dist/Rustle-*-setup.exe dist/Rustle-*-portable.zip dist/SHA256SUMS.txt --title "Rustle $tag" --notes-file docs/release-0.1.0.md