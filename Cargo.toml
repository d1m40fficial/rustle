[workspace]
resolver = "3"
members = [
    "crates/rustle-app",
    "crates/rustle-core",
    "crates/rustle-engine",
    "crates/rustle-platform",
    "crates/rustle-storage",
    "crates/rustle-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/d1m40fficial/rustle"

[workspace.dependencies]
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
url = "2"
windows-core = "0.62"
wry = { version = "0.57", features = ["devtools"] }
webview2-com = "0.39"
rustle-core = { path = "crates/rustle-core" }
rustle-storage = { path = "crates/rustle-storage" }
rustle-ui = { path = "crates/rustle-ui" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev.package."*"]
opt-level = 1